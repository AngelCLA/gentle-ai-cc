name: Published companion end-to-end

on:
  workflow_dispatch:
  push:
    branches: [fix/release-defaults, main]
    paths:
      - '.github/workflows/companion-e2e.yml'
      - 'tests/companion-e2e.ps1'
      - 'tests/installers.ps1'
      - 'install.ps1'
      - 'install.sh'
      - 'gentle-cc-install.sh'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/companion-e2e.yml'
      - 'tests/companion-e2e.ps1'
      - 'tests/installers.ps1'
      - 'install.ps1'
      - 'install.sh'
      - 'gentle-cc-install.sh'

permissions:
  contents: read

jobs:
  published-companion:
    name: ${{ matrix.os }} published release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Windows PowerShell installer fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/installers.ps1
      - name: Exercise published wrapper and companion
        shell: pwsh
        run: ./tests/companion-e2e.ps1

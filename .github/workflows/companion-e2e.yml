name: Published companion end-to-end

# The branch push runs the first diagnostic before this workflow is merged.
# Manual dispatch becomes available after the workflow reaches the default branch.
on:
  workflow_dispatch:
  push:
    branches: [fix/release-defaults]
    paths:
      - '.github/workflows/companion-e2e.yml'
      - 'tests/companion-e2e.ps1'
      - 'gentle-cc-install.sh'

permissions:
  contents: read

jobs:
  published-companion:
    name: ${{ matrix.os }} published release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise published wrapper and companion
        shell: pwsh
        run: ./tests/companion-e2e.ps1

name: Release HTTP diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-http:
    name: Public HTTPS transport only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Probe fixed public release URLs without executing downloads
        shell: bash
        run: python3 tests/release_http_diagnostics.py
